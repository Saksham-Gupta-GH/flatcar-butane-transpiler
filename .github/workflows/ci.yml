name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - run: go vet ./...

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go build -o transpiler .
      - run: ./transpiler -input examples/worker-node.cloud-config.yaml -output /tmp/out.yaml
      - run: grep -q "variant: flatcar" /tmp/out.yaml && echo "variant OK"
      - run: grep -q "version: 1.0.0" /tmp/out.yaml && echo "version OK"
      - run: cat /tmp/out.yaml
